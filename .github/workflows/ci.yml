name: 工具与脚手架
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@12.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  native-host:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - run: git config --global core.symlinks true
      - uses: actions/checkout@v4
        with:
          path: tools
          persist-credentials: false
      - name: Read host repository from SDK contract
        id: host
        working-directory: tools
        run: node -e "const {repository}=require('./packages/sdk/contract.json').hostReference; require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT,'repository='+repository+'\n')"
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.host.outputs.repository }}
          # contract.hostReference.commit 记录最早兼容宿主。联调使用包含最新回归用例的提交。
          ref: 602390cdd03aa3a9cd4c451513878f7e9eb9014c
          path: app
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true
      - run: npm install --global pnpm@12.21.0
      - run: pnpm install --frozen-lockfile
        working-directory: tools
      - run: pnpm build
        working-directory: tools
      - name: Prepare host dependencies and localization
        working-directory: app
        run: dart tool/project_prep.dart test
      - name: Prepare test assets and tool path
        run: |
          New-Item -ItemType Directory -Force app/assets/certs | Out-Null
          "FLUXDO_PLUGIN_TOOLS=$((Resolve-Path tools).Path)" >> $env:GITHUB_ENV
          "FLUXDO_APP=$((Resolve-Path app).Path)" >> $env:GITHUB_ENV
          "FLUXDO_DART=$env:FLUTTER_ROOT/bin/cache/dart-sdk/bin/dart.exe" >> $env:GITHUB_ENV
      - name: Check SDK, production parser and component contracts
        working-directory: app
        run: node tool/plugin_tools/check_sdk_contract.mjs
      - name: Check generated component parameters
        working-directory: app
        run: dart run tool/plugin_tools/export_components.dart test/fixtures/metaverse/sdk/components.json --check
      - name: Validate service UI using shipped parser
        working-directory: tools
        run: node --test test/rfw.test.mjs
      - name: Run real QuickJS HMR regression
        working-directory: app
        run: node --test tool/plugin_tools/native.test.mjs
      - name: Prepare SVG transformer before parallel asset compilation
        working-directory: app
        timeout-minutes: 2
        run: |
          New-Item -ItemType Directory -Force build/plugin-ci | Out-Null
          dart run jovial_svg_transformer --input=assets/logo.svg --output=build/plugin-ci/logo.si
          exit $LASTEXITCODE
      - name: Run App pairing, updates and isolation regression
        working-directory: app
        timeout-minutes: 10
        run: |
          flutter test --verbose --reporter expanded --file-reporter json:plugin-tools-tests.json test/modules/metaverse/metaverse_navigation_forum_test.dart test/modules/metaverse/metaverse_navigation_ui_test.dart test/modules/metaverse/metaverse_development_test.dart test/modules/metaverse/metaverse_development_connection_test.dart test/modules/metaverse/metaverse_development_integration_test.dart 2>&1 | Tee-Object -FilePath plugin-tools-build.log
          exit $LASTEXITCODE
      - name: Upload native test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-host-tests
          path: |
            app/plugin-tools-tests.json
            app/plugin-tools-build.log
          if-no-files-found: ignore

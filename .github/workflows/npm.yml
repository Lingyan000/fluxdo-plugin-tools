name: Publish npm packages
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 已公开的 GitHub Release 标签（v<版本>）
        required: true
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm install --global pnpm@12.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm pack:release
      - name: Verify version and release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node -e "const v=require('./package.json').version;if(process.env.RELEASE_TAG!=='v'+v)process.exit(1)"
          mkdir verified
          gh release download "$RELEASE_TAG" --dir verified --pattern '*.tgz' --pattern SHA256SUMS.txt
          cd verified
          sha256sum --check SHA256SUMS.txt
      - name: Publish verified release packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for package in verified/*.tgz; do
            name=$(tar -xOf "$package" package/package.json | node -e "let x='';process.stdin.on('data',v=>x+=v).on('end',()=>console.log(JSON.parse(x).name))")
            version=$(node -p "require('./package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already published"
            else
              npm publish "$package" --access public --provenance
            fi
          done
